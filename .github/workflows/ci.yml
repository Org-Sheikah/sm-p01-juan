name: CI Pipeline

on: push

jobs:
  # 1. Primer trabajo: Pruebas de la calculadora (sin Django)
  test_calculadora:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Ejecutar pruebas sin Django
        run: |
          python -m unittest discover  # O el comando que utilices para tus pruebas unitarias simples

  # 2. Segundo trabajo: Pruebas con Django
  test_django:
    runs-on: ubuntu-latest
    needs: test_calculadora  # <-- Esta línea conecta visualmente ambos trabajos con una flecha/enlace
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ejecutar pruebas de Django
        run: |
          python manage.py test