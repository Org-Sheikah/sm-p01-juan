name: CI Pipeline

on: push

jobs:
  # 1. Primer trabajo: Calculadora estática (Versión 1)
  test_calculadora:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generar sitio web estático
        run: python src/suma.py

      - name: Publicar enlace en el resumen del Job
        run: |
          echo "### 🚀 Versión 1: Calculadora Estática" >> $GITHUB_STEP_SUMMARY
          echo '<a href="https://org-sheikah.github.io/sm-p01-juan/" target="_blank">🌐 Abrir Calculadora Estática (Nueva Pestaña)</a>' >> $GITHUB_STEP_SUMMARY

  # 2. Segundo trabajo: Pruebas unitarias en Django (Versión 2)
  test_django:
    runs-on: ubuntu-latest
    needs: test_calculadora
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar configuración de Django
        run: python manage.py check

      - name: Ejecutar pruebas unitarias de Django
        run: python manage.py test

      - name: Publicar enlace en el resumen del Job
        run: |
          echo "### 🐍 Versión 2: Django CI Pipeline" >> $GITHUB_STEP_SUMMARY
          echo '<a href="https://github.com/Org-Sheikah/sm-p01-juan" target="_blank">📁 Ver Código Fuente del Proyecto Django (Nueva Pestaña)</a>' >> $GITHUB_STEP_SUMMARY