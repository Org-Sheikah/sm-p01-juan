name: CI Pipeline

on: push

jobs:
  # 1. Primer trabajo: Generar la calculadora en Python puro (Versión 1)
  test_calculadora:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generar sitio web estático
        run: python src/suma.py

  # 2. Segundo trabajo: Pruebas unitarias en Django (Versión 2)
  test_django:
    runs-on: ubuntu-latest
    needs: test_calculadora  # Conecta visualmente ambos bloques en el gráfico
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar configuración de Django
        run: python manage.py check

      - name: Ejecutar pruebas unitarias de Django
        run: python manage.py test